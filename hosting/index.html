<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodie Market - Authentic Home-Cooked Meals from Local Chefs</title>
    <meta name="description" content="Discover and order authentic, freshly prepared home-cooked meals from talented chefs in your neighborhood. Foodie Market connects you with real food and real people." />
    <meta name="keywords" content="home cooked food, local chefs, food delivery, authentic meals, neighborly food, healthy eating, homemade meals, food marketplace" />
    <link rel="canonical" href="https://foodie-marketplace.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://foodie-marketplace.com/" />
    <meta property="og:title" content="Foodie Market - Authentic Home-Cooked Meals from Local Chefs" />
    <meta property="og:description" content="Discover and order authentic, freshly prepared home-cooked meals from talented chefs in your neighborhood." />
    <meta property="og:image" content="https://foodie-marketplace.com/logo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://foodie-marketplace.com/" />
    <meta property="twitter:title" content="Foodie Market - Authentic Home-Cooked Meals from Local Chefs" />
    <meta property="twitter:description" content="Discover and order authentic, freshly prepared home-cooked meals from talented chefs in your neighborhood." />
    <meta property="twitter:image" content="https://foodie-marketplace.com/logo.png" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Foodie Market",
        "url": "https://foodie-marketplace.com",
        "logo": "https://foodie-marketplace.com/logo.png",
        "description": "Connecting talented home chefs with hungry neighbors for authentic, fresh, home-cooked meals.",
        "sameAs": [
          "https://twitter.com/foodiemarket",
          "https://facebook.com/foodiemarket",
          "https://instagram.com/foodiemarket"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Foodie Market",
        "url": "https://foodie-marketplace.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://foodie-marketplace.com/community/vendor-market?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    
    <!-- PWA -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
